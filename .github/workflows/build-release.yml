name: Build Morning Mist Installers

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: |
          brew install create-dmg
          flutter pub get

      - name: Prepare remote stub
        run: |
          mkdir -p build/remote
          echo "1.5.0" > build/remote/VERSION
          echo '{"version":"1.5.0","files":[]}' > build/remote/servers.json

      - name: Build macOS Application and DMG
        run: dart run tool/build_macos.dart --remote-built

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morning-Mist-macOS
          if-no-files-found: error
          path: |
            build/installers/Morning-Mist-*.dmg
            build/installers/Morning-Mist-*.zip

  windows:
    name: Build Windows Setup EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare remote stub
        shell: bash
        run: |
          mkdir -p build/remote
          echo "1.5.0" > build/remote/VERSION
          echo '{"version":"1.5.0","files":[]}' > build/remote/servers.json

      - name: Build Windows Application and Installer
        run: dart run tool/build_windows.dart --remote-built --stock-engine

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morning-Mist-Windows
          if-no-files-found: error
          path: build/installers/Morning-Mist-*-setup*.exe

  release:
    name: Create GitHub Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.5.0' }}
          name: Morning Mist ${{ github.ref_name || 'v1.5.0' }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
