name: Build Morning Mist Installers

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  remote:
    name: Build Remote Server
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Remote Server
        run: |
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          version=$(dart --version 2>&1 | sed -n 's/^Dart SDK version: \([^ ]*\) (\([a-z]*\)).*/\1 \2/p')
          read -r dart channel <<< "$version"
          echo "Dart $dart ($channel)"
          curl -fsSL -o "$RUNNER_TEMP/dart-x64.zip" \
            "https://storage.googleapis.com/dart-archive/channels/$channel/release/$dart/sdk/dartsdk-macos-x64-release.zip" || true
          if [ -f "$RUNNER_TEMP/dart-x64.zip" ]; then
            unzip -q "$RUNNER_TEMP/dart-x64.zip" -d "$RUNNER_TEMP/dart-x64"
            dart run tool/build_remote_server.dart --out build/remote --macos-x64-dart "$RUNNER_TEMP/dart-x64/dart-sdk/bin/dart"
          else
            dart run tool/build_remote_server.dart --out build/remote
          fi

      - name: Upload Remote Server
        uses: actions/upload-artifact@v4
        with:
          name: remote-server
          path: build/remote

  macos:
    name: Build macOS DMG
    needs: remote
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: |
          brew install create-dmg
          flutter pub get

      - name: Download Remote Server
        uses: actions/download-artifact@v4
        with:
          name: remote-server
          path: build/remote

      - name: Build macOS Application and DMG
        run: dart run tool/build_macos.dart --remote-built

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morning-Mist-macOS
          if-no-files-found: error
          path: |
            build/installers/Morning-Mist-*.dmg
            build/installers/Morning-Mist-*.zip

  windows:
    name: Build Windows Setup EXE
    needs: remote
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: flutter pub get

      - name: Download Remote Server
        uses: actions/download-artifact@v4
        with:
          name: remote-server
          path: build/remote

      - name: Build Windows Application and Installer
        run: dart run tool/build_windows.dart --remote-built --stock-engine

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morning-Mist-Windows
          if-no-files-found: error
          path: build/installers/Morning-Mist-*-setup*.exe

  release:
    name: Create GitHub Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.5.0' }}
          name: Morning Mist ${{ github.ref_name || 'v1.5.0' }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
